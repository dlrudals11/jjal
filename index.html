<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="하고 싶은 말을 입력하면 그 기분에 맞는 짤로 번역해 드립니다.">
  <meta name="theme-color" content="#0b0a0d">
  <title>my 짤 번역기 — 할 말을 짤로</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="ui/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- 1) 무대: 키류가 서 있고, 앞에 검색창이 있어요 -->
    <section id="stage" class="stage" aria-label="짤 검색">
      <div class="scene" aria-hidden="true"></div>

      <div class="stage-head">
        <span class="plaque">神室町</span>
        <h1 class="logo">my 짤 번역기</h1>
        <p class="sub">할 말을 치면 그 기분에 맞는 짤로 번역해 드립니다</p>
      </div>

      <div id="kiryu" class="kiryu" aria-hidden="true">
        <img id="kiryu-img" alt="" hidden>
        <div id="kiryu-ph" class="kiryu-ph" hidden></div>
      </div>

      <div id="bubble" class="bubble" aria-live="polite"><span id="bubble-text"></span></div>

      <div class="stage-dock">
        <div class="series-bar" role="group" aria-label="시리즈 선택"></div>

        <form id="search-form" class="search stage-form" autocomplete="off" role="search">
          <input id="jjal-input" type="text" placeholder="할 말을 입력하세요 (예: 오늘 진짜 지쳤다)" maxlength="100" aria-label="할 말 입력">
          <button type="submit" class="btn">번역</button>
        </form>

        <div id="examples" class="chips stage-chips" aria-label="예시 문장"></div>

        <div class="stage-foot">
          <p id="ai-status" class="ai-status" aria-live="polite"></p>
          <label class="fx-toggle"><input type="checkbox" id="fx-toggle" checked> 연출 보기</label>
          <button id="wish-open-stage" type="button" class="btn ghost small wish-open">♥ 찜 목록</button>
          <button id="random-stage" type="button" class="btn ghost small">아무 짤이나 보기</button>
        </div>
      </div>
    </section>

    <!-- 2) 결과 화면 -->
    <main id="results-view" class="wrap" hidden>
      <div class="results-scene" aria-hidden="true"></div>
      <img id="kiryu-result" class="kiryu-result" src="ui/kiryu_result.png" alt="" aria-hidden="true">
      <div class="results-top">
        <button id="back-btn" type="button" class="btn ghost small">← 다시 말하기</button>
        <div class="series-bar" role="group" aria-label="시리즈 선택"></div>
        <button id="wish-open-results" type="button" class="btn ghost small wish-open">♥ 찜 목록</button>
      </div>

      <header>
        <span class="plaque">神室町</span>
        <h1>my 짤 번역기</h1>
        <p class="sub">지금 <b id="count">0</b>장 준비돼 있어요.</p>
      </header>

      <div class="status">
        <p id="message" class="message" aria-live="polite"></p>
        <button id="share-btn" type="button" class="btn ghost small" hidden>결과 링크 복사</button>
      </div>
      <section id="results" class="grid" aria-label="검색 결과"></section>

      <div class="more">
        <button id="random-btn" type="button" class="btn ghost">아무 짤이나 보기</button>
      </div>

      <footer>
        팬이 만든 비공식 사이트입니다. 이미지의 저작권은 각 권리자에게 있습니다.
      </footer>
    </main>
  </div>

  <!-- 화면이 깨지는 연출 층 (평소에는 숨겨져 있어요) -->
  <div id="fx" class="fx" hidden aria-hidden="true">
    <svg id="glass" class="glass" preserveAspectRatio="none"></svg>
    <div id="smoke" class="smoke"></div>
    <div id="flash" class="flash"></div>
  </div>
  <div id="banner" class="banner" hidden></div>

  <!-- 큰 화면(짤을 클릭하면 열림) -->
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="짤 크게 보기">
    <div class="modal-box">
      <div class="modal-stage">
        <button id="modal-prev" type="button" class="nav-btn" aria-label="이전 짤">‹</button>
        <div id="modal-media" class="modal-media"></div>
        <button id="modal-next" type="button" class="nav-btn" aria-label="다음 짤">›</button>
      </div>
      <p id="modal-count" class="modal-count"></p>
      <p id="modal-series" class="modal-series"></p>
      <p id="modal-desc" class="modal-desc"></p>

      <div class="phrase-box">
        <p class="phrase-title">이럴 때 보내세요. 문장을 누르면 복사돼요.</p>
        <div id="modal-phrases" class="phrases"></div>
      </div>

      <div class="modal-actions">
        <button id="modal-copy" type="button" class="btn">이미지 복사</button>
        <button id="modal-share" type="button" class="btn" hidden>공유</button>
        <button id="modal-wish" type="button" class="btn ghost">♡ 찜하기</button>
        <a id="modal-download" class="btn ghost" href="#">저장</a>
        <button id="modal-close" type="button" class="btn ghost">닫기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    // 앱처럼 설치하고 오프라인에서도 열리게 해 주는 서비스 워커 (https 주소에서만 동작)
    if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
